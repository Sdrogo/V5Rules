name: Android CI & Release

on:
  push:
    branches:
      - "master"
      - "feature/*"
      - "bugfix/*"
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - "master"

jobs:
  # JOB 1: CONTROLLO QUALITÀ (LINT & TEST)
  # Viene eseguito su TUTTI i push e PR per garantire che il codice non sia rotto.
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Corretto a v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Corretto a v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Esegue Lint e Unit Test (veloce, senza buildare l'APK completo)
      - name: Run Lint and Unit Tests
        run: ./gradlew lintDebug testDebugUnitTest

  # JOB 2: CREAZIONE APK E RELEASE
  # Eseguito solo su Master o Tag, e solo se il controllo qualità passa.
  build-and-release:
    needs: check-quality # Dipende dal successo del job precedente
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso necessario per creare la GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Necessario per il conteggio commit

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Set Version Name and Code
        id: versioning # Diamo un ID per usare le variabili negli step successivi
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF#refs/tags/}
          else
            VERSION_NAME="master-${GITHUB_SHA::7}"
          fi
          # Calcolo Version Code
          VERSION_CODE=$(git rev-list --count HEAD)
          
          echo "APP_VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          
          # Output per step successivi (opzionale ma pulito)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease -PappVersionCode=${{ env.APP_VERSION_CODE }} -PappVersionName=${{ env.APP_VERSION_NAME }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      # Carica l'APK come artefatto (visibile nel riepilogo del workflow)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # Corretto a v4
        with:
          name: V5Rules-App-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14 # Risparmia spazio su GitHub

      # NUOVO STEP: Crea una Release ufficiale su GitHub se è un TAG
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Usa il nome della versione come titolo della release
          name: Release ${{ env.APP_VERSION_NAME }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pulizia (Opzionale, i runner sono effimeri, ma è buona pratica)
      - name: Clean up Keystore
        if: always()
        run: rm -f keystore.jks
